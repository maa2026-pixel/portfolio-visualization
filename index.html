<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16年間の制作を読み直す</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:#fff; color:#111; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",YuGothic,Arial,sans-serif; }
  .shell { min-height:100vh; display:flex; flex-direction:column; }
  .topbar { height:52px; flex:0 0 52px; display:flex; align-items:center; justify-content:center; border-bottom:1px solid #ececec; background:rgba(255,255,255,.96); }
  .switcher { display:inline-flex; align-items:center; gap:28px; height:100%; }
  .tab { appearance:none; border:0; background:none; padding:0; height:100%; position:relative; color:#8a8a8a; font-size:13px; letter-spacing:.02em; cursor:pointer; }
  .tab:hover { color:#333; }
  .tab[aria-selected="true"] { color:#111; }
  .tab[aria-selected="true"]::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:#111; }
  .stage { flex:1 1 auto; min-height:0; position:relative; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
  .hidden { display:none; }
  @media (max-width:640px) { .topbar{height:48px;flex-basis:48px}.switcher{gap:22px}.tab{font-size:12px} }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar" aria-label="表示切り替え">
    <nav class="switcher" role="tablist" aria-label="チャート表示">
      <button class="tab" id="tab-bubble" role="tab" aria-selected="true" aria-controls="panel-bubble" type="button">Bubble</button>
      <button class="tab" id="tab-timeline" role="tab" aria-selected="false" aria-controls="panel-timeline" type="button">Timeline</button>
    </nav>
  </header>
  <main class="stage">
    <iframe id="panel-bubble" role="tabpanel" aria-labelledby="tab-bubble" src="bubble.html" title="円形バブルチャート"></iframe>
    <iframe id="panel-timeline" class="hidden" role="tabpanel" aria-labelledby="tab-timeline" src="timeline.html" title="タイムラインチャート"></iframe>
  </main>
</div>
<script>
(() => {
  const tabs=[
    {button:document.getElementById('tab-bubble'), panel:document.getElementById('panel-bubble'), hash:'#bubble'},
    {button:document.getElementById('tab-timeline'), panel:document.getElementById('panel-timeline'), hash:'#timeline'}
  ];
  function activate(index, updateHash=true){
    tabs.forEach((t,i)=>{
      const on=i===index;
      t.button.setAttribute('aria-selected', String(on));
      t.panel.classList.toggle('hidden', !on);
      t.panel.toggleAttribute('hidden', !on);
    });
    if(updateHash) history.replaceState(null,'',tabs[index].hash);
  }
  tabs.forEach((t,i)=>t.button.addEventListener('click',()=>activate(i)));
  activate(location.hash==='#timeline'?1:0,false);
})();
</script>
</body>
</html>
