<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>79 Works — Bubble Physics v10</title>
<style>
:root{--bg:#f7f7f5;--panel:#fbfbfa;--ink:#222;--muted:#8a8a86;--line:#deded9;--line2:#c9c9c3}
*{box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}
.app{width:100%;height:100vh}
.panel{position:fixed;left:0;top:0;bottom:0;width:350px;padding:18px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;z-index:10;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
h1{font-size:15px;margin:0 0 4px}
.sub{font-size:9px;line-height:1.6;color:#888;margin-bottom:14px}
.group{border-top:1px solid var(--line);padding-top:13px;margin-top:13px}
.group-title{font-size:9px;font-weight:700;letter-spacing:.08em;color:#666;margin-bottom:9px}
.view-switch,.layer-switch,.mode-switch,.work-switch{display:grid;gap:5px}
.view-switch{grid-template-columns:1fr 1fr}
.layer-switch{grid-template-columns:1fr 1fr}
.mode-switch{grid-template-columns:1fr 1fr}
.work-switch{grid-template-columns:1fr 1fr}
.view-btn,.layer-btn,.mode-btn,.work-btn,button{appearance:none;border:1px solid var(--line2);background:#fff;color:#333;border-radius:0;padding:7px 8px;font-size:9px;cursor:pointer}
.view-btn.active,.layer-btn.active,.mode-btn.active,.work-btn.active{background:#272725;color:#fff;border-color:#272725}
.layer-btn small,.mode-btn small,.work-btn small{display:block;font-size:7.5px;color:#999;margin-top:3px;line-height:1.35}
.layer-btn.active small,.mode-btn.active small,.work-btn.active small{color:#ccc}
.control{margin-bottom:11px}
.control-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
label{font-size:9px} output{font-size:8px;color:#888}
input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:12px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:#bdbdb8}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;background:#333;margin-top:-3.5px}
.check{display:flex;gap:7px;align-items:center;margin:7px 0;font-size:9px}
input[type=checkbox]{accent-color:#222}
.legend{display:grid;gap:1px}
.legend-row{display:flex;align-items:center;gap:7px;min-height:21px;font-size:9px;cursor:pointer}
.legend-row.muted{opacity:.28} .legend-row.active{font-weight:700}
.swatch{width:9px;height:9px;border-radius:50%;border:.5px solid;flex:none}
.legend-value{margin-left:auto;color:#888;font-size:8px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}
.buttons .wide{grid-column:1/-1}
.note,.stats{font-size:8px;line-height:1.6;color:#888}
.note{margin-top:10px} .stats{margin-top:9px;border-top:1px solid var(--line);padding-top:9px}
.stage{position:fixed;left:350px;right:0;top:0;bottom:0;display:grid;place-items:center;padding:18px}
svg{width:min(calc(100vw - 390px),calc(100vh - 36px));height:min(calc(100vw - 390px),calc(100vh - 36px));background:#fff;box-shadow:0 1px 12px rgba(0,0,0,.04)}
#tooltip{position:fixed;display:none;pointer-events:none;z-index:99;padding:7px 9px;border:1px solid #ddd;background:rgba(255,255,255,.97);font-size:9px;line-height:1.5;box-shadow:0 3px 12px rgba(0,0,0,.08);max-width:300px}
.guide{font-size:13px;fill:#999}
.ui-hidden{display:none !important}
.link{stroke:#888;stroke-width:.55;opacity:.38}

@media (max-width: 760px){
  html,body{width:100%;height:100%;overflow:hidden;background:#fff}
  body{background:#fff}
  .app{width:100%;height:100%;position:relative}
  .panel{position:fixed;left:0;right:0;top:0;bottom:auto;width:100%;height:60%;padding:14px 14px 10px;background:#fff;border-right:0;border-bottom:1px solid var(--line);overflow-y:auto;overflow-x:hidden;z-index:10}
  .stage{position:fixed;left:0;right:0;top:60%;bottom:0;display:flex;align-items:flex-end;justify-content:center;padding:0 8px;background:#fff;overflow:hidden}
  svg{width:min(calc(100vw - 16px),100%);height:auto;max-width:100%;max-height:100%;aspect-ratio:1/1;background:#fff;box-shadow:none;flex:none}
  #tooltip{font-size:10px;max-width:calc(100vw - 24px)}
}
</style>
</head>
<body>
<div class="app">
<aside class="panel">
  <h1>79 Works — Bubble Physics</h1>
  <div class="sub">前の物理シミュレーションを残したまま、「作品の性質」と「デザイン領域」を切り替えられる版です。デザイン領域の色は、もう少し可愛く見えるように、薄めのネオン感は残しつつ、少しくすませたダスティパステル寄りの配色に調整しています。</div>

  <div class="group">
    <div class="group-title">CHART VIEW</div>
    <div class="view-switch">
      <button class="view-btn active" type="button" data-view="bubble">バブルチャート</button>
      <button class="view-btn" type="button" data-view="timeline">タイムライン</button>
    </div>
  </div>

  <div class="group">
    <div class="group-title">LAYER</div>
    <div class="layer-switch">
      <button class="layer-btn active" data-layer="property">作品の性質<small>10分類</small></button>
      <button class="layer-btn" data-layer="domain">デザイン領域<small>独立評価</small></button>
    </div>
  </div>

  <div class="group">
    <div class="group-title">LAYOUT MODE</div>
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="relation">関係性<small>似た性質を引き合わせる</small></button>
      <button class="mode-btn" data-mode="category">分類<small>同色・同領域をまとめる</small></button>
      <button class="mode-btn" data-mode="work">作品<small>同じ作品を集める</small></button>
      <button class="mode-btn" data-mode="time">時間<small>同年代を近づける</small></button>
    </div>
  </div>

  <div class="group">
    <div class="group-title">PHYSICS / LAYOUT</div>
    <div class="control"><div class="control-head"><label>外円サイズ</label><output id="outerROut"></output></div><input id="outerR" type="range" min="420" max="680" step="5" value="610"></div>
    <div class="control"><div class="control-head"><label>円全体のサイズ</label><output id="sizeOut"></output></div><input id="size" type="range" min="0.35" max="6" step="0.05" value="0.72"></div>
    <div class="control"><div class="control-head"><label>円の重なり許容</label><output id="overlapOut"></output></div><input id="overlap" type="range" min="0.72" max="1.15" step="0.01" value="0.96"></div>
    <div class="control ui-hidden"><div class="control-head"><label>分類のまとまり</label><output id="categoryForceOut"></output></div><input id="categoryForce" type="range" min="0" max="0.08" step="0.002" value="0.018"></div>
    <div class="control ui-hidden"><div class="control-head"><label>データ関係の引力</label><output id="relationForceOut"></output></div><input id="relationForce" type="range" min="0" max="0.12" step="0.002" value="0.026"></div>
    <div class="control ui-hidden"><div class="control-head"><label>同一作品のまとまり</label><output id="workForceOut"></output></div><input id="workForce" type="range" min="0" max="0.12" step="0.002" value="0.020"></div>
    <div class="control"><div class="control-head"><label>外周から中へ戻す力</label><output id="edgeForceOut"></output></div><input id="edgeForce" type="range" min="0.05" max="0.60" step="0.01" value="0.28"></div>
    <div class="control"><div class="control-head"><label>中央への圧縮</label><output id="densityForceOut"></output></div><input id="densityForce" type="range" min="0" max="0.004" step="0.0001" value="0.0007"></div>

    <div class="check"><input id="showLinks" type="checkbox" checked><label for="showLinks">ホバー時に関係線を表示</label></div>
    <div class="check"><input id="colorGroupMode" type="checkbox"><label for="colorGroupMode">色のまとまり優先</label></div>
  </div>

  <div class="group">
    <div class="group-title" id="legendTitle">CATEGORY / FOCUS</div>
    <div id="legend" class="legend"></div>
  </div>



  <div class="group">
    <div class="group-title">WORK FOCUS</div>
    <div class="work-switch">
      <button class="work-btn active" data-highlight="all">全作品<small>通常表示</small></button>
      <button class="work-btn" data-highlight="cowkeys">コーキーズ<small>ショートケーキ含む</small></button>
      <button class="work-btn" data-highlight="kiehl">きえ〜る<small>リブランディング</small></button>
      <button class="work-btn" data-highlight="niseko">ニセコ<small>サイン計画</small></button>
      <button class="work-btn" data-highlight="robot">産業ロボット<small>HMI / UI・UX</small></button>
    </div>
    <div class="note">選択した作品のみカラー表示、その他はグレー表示。作品モードと組み合わせると見やすいです。</div>
  </div>

  <div class="buttons">
    <button id="pauseBtn">一時停止</button>
    <button id="resetBtn">再配置</button>
    <button id="shuffleZBtn">重なり順シャッフル</button>
    <button id="containBtn">外円の中に収める</button>
    <button id="fitBtn">外円を自動フィット</button>
    <button id="grayBtn">グレー表示</button>
    <button id="exportBtn">SVGを書き出す</button>
  </div>

  <div class="note" id="note">物理シミュレーションは常時動作。ドラッグもできます。</div>
  <div id="stats" class="stats"></div>
</aside>

<main class="stage">
<svg id="viz" viewBox="0 0 1400 1400">
  <rect width="1400" height="1400" fill="#fff"/>
  <circle id="boundary" cx="700" cy="700" r="610" fill="none" stroke="none" stroke-width="0"/>
  <g id="guides"></g>
  <g id="links"></g>
  <g id="nodes"></g>
</svg>
</main>
</div>
<div id="tooltip"></div>

function scoreRadius(v){
  const raw=+v;
  if(!Number.isFinite(raw)||raw<=0)return 0;
  const x=Math.max(5,Math.min(100,raw));
  if(scoreR[x]!=null)return scoreR[x];
  const ks=[5,20,40,60,80,100];
  for(let i=0;i<ks.length-1;i++){
    const a=ks[i],b=ks[i+1];
    if(x>=a&&x<=b){const t=(x-a)/(b-a);return scoreR[a]+(scoreR[b]-scoreR[a])*t;}
  }
  return scoreR[5];
}

function buildRelations(){
  // Fast relation calculation: similarity is determined by indicator/domain,
  // so calculate each indicator pair once instead of repeating the same
  // 79-dimensional cosine calculation for every node pair.
  const indicators=[...new Set(nodes.map(n=>n.indicator))];
  const workNames=[...new Set(nodes.map(n=>n.work))];
  const workIdx=new Map(workNames.map((v,i)=>[v,i]));
  const M=new Map(indicators.map(ind=>[ind,Array(workNames.length).fill(0)]));
  nodes.forEach(n=>{M.get(n.indicator)[workIdx.get(n.work)]=n.weight/100;});

  const simMap=new Map();
  for(const a of indicators){
    const va=M.get(a), list=[];
    for(const b of indicators){
      const vb=M.get(b); let dot=0,aa=0,bb=0;
      for(let k=0;k<va.length;k++){const x=va[k],y=vb[k];dot+=x*y;aa+=x*x;bb+=y*y;}
      const r=aa&&bb?dot/Math.sqrt(aa*bb):0;
      if(r>0.28)list.push([b,r]);
    }
    list.sort((x,y)=>y[1]-x[1]);
    simMap.set(a,list);
  }

  const byIndicator=new Map(indicators.map(ind=>[ind,[]]));
  nodes.forEach((n,i)=>byIndicator.get(n.indicator).push(i));
  neighbors=nodes.map((a,i)=>{
    const arr=[];
    for(const [ind,r] of simMap.get(a.indicator)){
      for(const j of byIndicator.get(ind)){
        if(j===i)continue;
        arr.push([j,r]);
        if(arr.length>=5)return arr;
      }
    }
    return arr;
  });
}

  seed++;
  const R=+ctl.outerR.value*0.72;
  nodes.forEach(n=>{const a=rand()*Math.PI*2,rr=Math.sqrt(rand())*R;n.x=CX+Math.cos(a)*rr;n.y=CY+Math.sin(a)*rr;n.vx=(rand()-.5)*1.2;n.vy=(rand()-.5)*1.2;n.fixed=false;});
}

function containAll(){
  const R=+ctl.outerR.value;
  nodes.forEach(n=>{
    n.r=radius(n);
    const dx=n.x-CX,dy=n.y-CY,d=Math.hypot(dx,dy)||1,maxD=Math.max(1,R-n.r-3);
    if(d>maxD){n.x=CX+dx/d*maxD;n.y=CY+dy/d*maxD;n.vx*=.15;n.vy*=.15;}
  });
}

function fitOuter(){
  let max=0;
  nodes.forEach(n=>{max=Math.max(max,Math.hypot(n.x-CX,n.y-CY)+radius(n));});
  ctl.outerR.value=Math.max(+ctl.outerR.min,Math.min(+ctl.outerR.max,Math.ceil(max+16)));
  boundary.setAttribute('r',ctl.outerR.value);
  updateOutputs();
}

function updateOutputs(){
  out.outerR.textContent=ctl.outerR.value+' px';
  out.size.textContent=(+ctl.size.value).toFixed(2)+'×';
  out.overlap.textContent=(+ctl.overlap.value).toFixed(2);
  out.categoryForce.textContent=(+ctl.categoryForce.value).toFixed(3);
  out.relationForce.textContent=(+ctl.relationForce.value).toFixed(3);
  out.workForce.textContent=(+ctl.workForce.value).toFixed(3);
  out.edgeForce.textContent=(+ctl.edgeForce.value).toFixed(2);
  out.densityForce.textContent=(+ctl.densityForce.value).toFixed(4);
}

function step(){
  if(!paused){
    const R=+ctl.outerR.value,overlap=+ctl.overlap.value;
    const catF=+ctl.categoryForce.value,relF=+ctl.relationForce.value,workF=+ctl.workForce.value;
    const edgeF=+ctl.edgeForce.value,density=+ctl.densityForce.value;
    const cCenters=categoryCenters(),wCenters=workCenters(),yCenters=yearCenters();
    const colorPriority=document.getElementById('colorGroupMode').checked;

    nodes.forEach(n=>{n.r=radius(n);if(n.fixed)return;
      let tx=CX,ty=CY,k=0;
      if(mode==='category'||colorPriority){[tx,ty]=cCenters[n.category];k=catF*0.18;}
      else if(mode==='work'){[tx,ty]=wCenters[n.work];k=workF*0.20;}
      else if(mode==='time'){[tx,ty]=yCenters[n.yearN];k=0.006;}
      else {k=0;}
      n.vx+=(tx-n.x)*k;n.vy+=(ty-n.y)*k;
      n.vx+=(CX-n.x)*density;n.vy+=(CY-n.y)*density;

      const dx=n.x-CX,dy=n.y-CY,d=Math.hypot(dx,dy)||1,maxD=R-n.r-2;
      if(d>maxD){const ex=d-maxD;n.vx-=(dx/d)*ex*edgeF;n.vy-=(dy/d)*ex*edgeF;}
    });

    // Relation springs
    if(mode==='relation'&&!colorPriority){
      for(let i=0;i<nodes.length;i++){const a=nodes[i];
        for(const [j,r] of (neighbors[i]||[])){if(j<=i)continue;const b=nodes[j];
          const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
          const desired=(a.r+b.r)*(1.0+1.8*(1-r));
          const f=Math.max(-1.7,Math.min(1.7,(d-desired)*relF*r*0.16));
          if(!a.fixed){a.vx+=ux*f;a.vy+=uy*f};if(!b.fixed){b.vx-=ux*f;b.vy-=uy*f};
        }
      }
    }

    // Same-work attraction, always subtle; stronger in work mode
    const workStrength=(mode==='work'?workF:workF*0.28);
    if(workStrength>0){
      const buckets={};nodes.forEach((n,i)=>{(buckets[n.work]??=[]).push(i)});
      Object.values(buckets).forEach(arr=>{if(arr.length<2)return;
        let mx=0,my=0;arr.forEach(i=>{mx+=nodes[i].x;my+=nodes[i].y});mx/=arr.length;my/=arr.length;
        arr.forEach(i=>{const n=nodes[i];if(!n.fixed){n.vx+=(mx-n.x)*workStrength*0.08;n.vy+=(my-n.y)*workStrength*0.08}});
      });
    }

    // Collision with grid
    const maxR=Math.max(...nodes.map(n=>n.r)),cell=Math.max(18,maxR*2.2),grid=new Map();
    const key=(x,y)=>x+','+y;
    nodes.forEach((n,i)=>{const ix=Math.floor(n.x/cell),iy=Math.floor(n.y/cell),k=key(ix,iy);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(i)});
    for(let i=0;i<nodes.length;i++){const a=nodes[i],ix=Math.floor(a.x/cell),iy=Math.floor(a.y/cell);
      for(let gx=ix-1;gx<=ix+1;gx++)for(let gy=iy-1;gy<=iy+1;gy++){const arr=grid.get(key(gx,gy));if(!arr)continue;
        for(const j of arr){if(j<=i)continue;const b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,minD=overlap*(a.r+b.r);
          if(d<minD){const push=(minD-d)*.16,ux=dx/d,uy=dy/d;if(!a.fixed){a.vx-=ux*push;a.vy-=uy*push};if(!b.fixed){b.vx+=ux*push;b.vy+=uy*push}}
        }
      }
    }

    nodes.forEach(n=>{if(n.fixed)return;n.vx*=.84;n.vy*=.84;const s=Math.hypot(n.vx,n.vy),mx=2.4;if(s>mx){n.vx=n.vx/s*mx;n.vy=n.vy/s*mx};n.x+=n.vx;n.y+=n.vy;});
    containAll();
  }
  draw();
  requestAnimationFrame(step);
}

function draw(){
  updateOutputs();boundary.setAttribute('r',ctl.outerR.value);
  const pal=palette();const cs=cats();

  // guides
  guidesG.innerHTML='';
  if(mode==='category'){
    const cc=categoryCenters();cs.forEach(c=>{const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('class','guide');t.setAttribute('x',cc[c][0]);t.setAttribute('y',cc[c][1]-60);t.setAttribute('text-anchor','middle');t.textContent=c;guidesG.appendChild(t)})
  } else if(mode==='time'){
    const yc=yearCenters();Object.keys(yc).forEach(y=>{const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('class','guide');t.setAttribute('x',yc[y][0]);t.setAttribute('y',yc[y][1]-44);t.setAttribute('text-anchor','middle');t.textContent=y;guidesG.appendChild(t)})
  }

  nodeEls.forEach((el,i)=>{
    const n=nodes[i];
    const baseCol=pal[n.category]||{fill:'#e6e6e6',stroke:'#8a8a8a'};
    const grayCol={fill:'#ececec',stroke:'#c8c8c8'};
    const useColor = currentHighlight==='all' ? !grayscale : isHighlightedWork(n.work);
    const col=useColor ? baseCol : grayCol;
    const mutedByFocus=focus!==null&&focus!==n.category;
    const inWorkFocus=currentHighlight==='all' ? true : isHighlightedWork(n.work);
    let fill=col.fill, stroke=col.stroke, opacity=inWorkFocus?1:0.8, sw=inWorkFocus?0.7:0.55;
    if(currentHighlight==='all' && grayscale){ fill='#d0d0d0'; stroke='#8a8a8a'; }
    if(mutedByFocus && inWorkFocus){ fill='#fff'; stroke='#aaa'; opacity=0.95; sw=0.6; }
    if(currentHighlight!=='all' && !inWorkFocus){ fill='#ffffff'; stroke='#bdbdbd'; opacity=1; sw=0.55; }
    if(currentHighlight!=='all' && inWorkFocus && !mutedByFocus){ sw=0.95; }
    el.setAttribute('cx',n.x);el.setAttribute('cy',n.y);el.setAttribute('r',n.r);
    el.setAttribute('fill',fill);el.setAttribute('stroke',stroke);el.setAttribute('stroke-width',sw);el.setAttribute('opacity',opacity);
  });

  // Keep focused works in front, while preserving a mixed/randomized order within each layer.
  if(currentHighlight!=='all') applyZOrder();

  drawLinks();
}

function drawLinks(){
  linksG.innerHTML='';
  if(mode!=='relation'||!document.getElementById('showLinks').checked)return;
  if(!tooltip.style.display||tooltip.style.display==='none')return;
}

function drawLegend(){
  const box=document.getElementById('legend');box.innerHTML='';
  document.getElementById('legendTitle').textContent=layer==='property'?'CATEGORY / FOCUS':'DOMAIN / FOCUS';
  const all=document.createElement('div');all.className='legend-row'+(focus===null?' active':'');all.innerHTML='<span class="swatch" style="background:#fff;border-color:#aaa"></span><span>全体表示</span>';all.onclick=()=>{focus=null;drawLegend();};box.appendChild(all);
  cs=cats();pal=palette();
  cs.forEach(c=>{const row=document.createElement('div');row.className='legend-row'+(focus===c?' active':'')+(focus&&focus!==c?' muted':'');
    const val=layer==='domain'?`${DOMAIN_TOTALS[c]||0} / ${DOMAIN_COUNTS[c]||0}件`:'';
    row.innerHTML=`<span class="swatch" style="background:${pal[c].fill};border-color:${pal[c].stroke}"></span><span>${c}</span><span class="legend-value">${val}</span>`;
    row.onclick=()=>{focus=focus===c?null:c;drawLegend();};box.appendChild(row);
  });
  const baseStats = layer==='property'
    ? '作品の性質：既存5分類＋追加5軸（誘導・委ねる・刺激の強度・余白・即時理解）。'
    : 'デザイン領域：各作品の関与度を独立評価。複数領域が同時に強くてもそのまま表示。';
  const workStats = currentHighlight==='all'
    ? '作品フォーカス：全作品表示。'
    : `作品フォーカス：${highlightLabel()}のみカラー表示、その他はグレー表示。`;
  document.getElementById('stats').innerHTML = baseStats + '<br>' + workStats;
}

document.querySelectorAll('.layer-btn').forEach(btn=>btn.onclick=()=>{layer=btn.dataset.layer;focus=null;document.querySelectorAll('.layer-btn').forEach(b=>b.classList.toggle('active',b===btn));buildNodes();drawLegend();});
document.querySelectorAll('.mode-btn').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b===btn));});
document.querySelectorAll('.work-btn').forEach(btn=>btn.onclick=()=>{
  currentHighlight=btn.dataset.highlight;
  document.querySelectorAll('.work-btn').forEach(b=>b.classList.toggle('active',b===btn));
  drawLegend();
  draw();
});
ids.forEach(id=>ctl[id].oninput=()=>{if(id==='outerR')containAll();});
document.getElementById('pauseBtn').onclick=()=>{paused=!paused;document.getElementById('pauseBtn').textContent=paused?'再開':'一時停止'};
document.getElementById('resetBtn').onclick=resetPositions;
document.getElementById('shuffleZBtn').onclick=shuffleZOrder;
document.getElementById('containBtn').onclick=containAll;
document.getElementById('fitBtn').onclick=fitOuter;
document.getElementById('grayBtn').onclick=()=>{grayscale=!grayscale};
document.getElementById('exportBtn').onclick=()=>{
  const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const blob=new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`79works_bubble_physics_${layer}_${mode}.svg`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);
};

buildNodes();drawLegend();step();
</script>

        window.parent.postMessage({ type: 'portfolio-view', view }, '*');
